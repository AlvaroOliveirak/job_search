# ==============================================================================
# Job Search Backend - Spring Boot Configuration
# ==============================================================================
spring.application.name=job-search-backend
server.port=8080

# ------------------------------------------------------------------------------
# Banco de Dados H2 (Memória para desenvolvimento e avaliação acadêmica rápida)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:jobsearchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Web (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security
# ------------------------------------------------------------------------------
# Chave HMAC-SHA256 (Base64) de 256 bits
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tempo de expiração do Token (em milissegundos) - 86.400.000 ms = 24 horas
jwt.expiration=86400000

# ------------------------------------------------------------------------------
# CORS (Permite requisições do Front-End React/Vite)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# ------------------------------------------------------------------------------
# Perfil Opcional para PostgreSQL (Para Produção / Docker)
# Para ativar: adicione no application.properties ou use -Dspring.profiles.active=prod
