# ==============================================================================
# Job Search Backend - Spring Boot Configuration
# ==============================================================================
spring.application.name=job-search-backend
server.port=8082

# Expõe o campo "message" nos erros HTTP (ex.: "E-mail ou senha incorretos.").
# No Spring Boot 4 as antigas server.error.* foram substituídas por spring.web.error.*
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# Banco de Dados H2 (Memória para desenvolvimento e avaliação acadêmica rápida)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:jobsearchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Web (acessível em http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security
# ------------------------------------------------------------------------------
# Chave HMAC-SHA256 em Base64 (mínimo 256 bits). Defina a variável de ambiente JWT_SECRET fora do
# ambiente de desenvolvimento. O valor padrão abaixo é SÓ para desenvolvimento local.
jwt.secret=${JWT_SECRET:C244A34C2D42989BE3BE7288FBBA65D389260DBA87BF2F73E38B4E193BA222AD}
# Tempo de expiração do Token (em milissegundos) - 86.400.000 ms = 24 horas
jwt.expiration=86400000

# ------------------------------------------------------------------------------
# Token interno do endpoint /api/jobs/sync (Python -> Spring Boot)
# ------------------------------------------------------------------------------
# Vazio = gera um token aleatório a cada inicialização e repassa ao Python
# automaticamente. Defina SYNC_TOKEN para rodar o pipeline Python manualmente.
app.sync.token=${SYNC_TOKEN:}

# ------------------------------------------------------------------------------
# CORS (Permite requisições do Front-End React/Vite)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# ------------------------------------------------------------------------------
# Perfil Opcional para PostgreSQL (Para Produção / Docker)
# Para ativar: adicione no application.properties ou use -Dspring.profiles.active=prod
